---
apiVersion: v1
kind: Secret
metadata:
  name: ADMIN-SECRET
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: ADMIN-SA
type: kubernetes.io/service-account-token

---
apiVersion: v1
kind: Secret
metadata:
  name: ADMIN-SECRET
  annotations:
    kubernetes.io/service-account.name: ADMIN-SA
type: kubernetes.io/service-account-token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ADMIN-CR
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ADMIN-CRB
subjects:
  - kind: ServiceAccount
    name: ADMIN-SA
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ADMIN-CR
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
clusters:
  - cluster:
      certificate-authority-data: <cert-authority-data>
      server: https://server.ip.address:6443
    name: CLUSTER
contexts:
  - context:
      cluster: CLUSTER
      user: CLUSTER-ADMIN
    name: CONTEXT
current-context: CONTEXT
kind: Config
users:
  - name: ADMIN
    user:
      token: { secret-token }

---
# kubectl get secrets -n kube-system
# kubectl describe secrets admin-secret -n kube-system
