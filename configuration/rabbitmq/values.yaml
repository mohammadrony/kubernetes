persistence:
  enabled: true
  storageClass: "longhorn"
  size: "500Mi"

plugins:
  - rabbitmq_federation
  - rabbitmq_management
  - rabbitmq_peer_discovery_k8s
  - rabbitmq_management_agent
  - rabbitmq_auth_backend_ldap

replicaCount: 2

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"
