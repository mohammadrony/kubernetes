apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry
  namespace: opentelemetry
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.104.1
  mode: daemonset
  hostNetwork: true
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_size: 10000
        timeout: 10s
      resourcedetection:
        detectors: ["env", "system"]
        override: false
      attributes:
        actions:
          - action: insert
            key: loki.attribute.labels
            value: event.domain, event.name
          - action: insert
            key: loki.resource.labels
            value: service.name, service.namespace
          - action: insert
            key: traceID
            value: trace.id
      transform/drop_unneeded_resource_attributes:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(attributes, "process.command_args")
              - delete_key(attributes, "process.executable.path")
              - delete_key(attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
        log_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(attributes, "process.command_args")
              - delete_key(attributes, "process.executable.path")
              - delete_key(attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")

    exporters:
      debug:
        verbosity: detailed
      otlp:
        endpoint: tempo-distributor.monitoring.svc:4317
        tls:
          insecure: true
      loki:
        endpoint: "http://loki-gateway.monitoring.svc/loki/api/v1/push"
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors:
            [
              memory_limiter,
              resourcedetection,
              transform/drop_unneeded_resource_attributes,
              batch,
            ]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors:
            [
              memory_limiter,
              resourcedetection,
              transform/drop_unneeded_resource_attributes,
              attributes,
              batch,
            ]
          exporters: [debug, loki]
