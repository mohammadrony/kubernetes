apiVersion: v1
kind: Pod
metadata:
  name: nettools
spec:
  containers:
    - name: nettools
      image: jrecord/nettools:latest
      command:
        - sleep
        - "3600"
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          memory: 512Mi
          cpu: "1"
        requests:
          memory: 256Mi
          cpu: "0.2"
  restartPolicy: Never
